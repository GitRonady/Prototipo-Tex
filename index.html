<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <title> Formulario Plano de Ação </title>
</head>

<body>
<form id="formPlano">
    <label> Area responsavel* </label><br>
    <select name="area" required>
        <option value=""> Selecione a area </option>
        <option>Coleta</option>
        <option>HUB e MH</option>
        <option>Transferencia</option>
        <option>Last Mile</option>
        <option>Planejamento</option>
        <option>Outras Areas</option>
    </select>
    
    <br><br>
    <label>Problema Identificado*</label><br>
    <textarea name="problema" rows="4" cols="40" placeholder="Descreva o Problema operacional..." required></textarea>
    <br><br>
    
    <label>Causa Raiz*</label><br>
    <textarea name="causa" rows="4" cols="40" placeholder="Qual é a Causa Identificada?" required></textarea>
    <br><br>
    
    <label>Plano de ação*</label><br>
    <textarea name="plano" rows="4" cols="40" placeholder="O que Será Feito Para Resolver o Problema?" required></textarea>
    <br><br>
    
    <label>Responsavel*</label><br>
    <input type="text" name="responsavel" placeholder="Nome do responsavel" required>
    <br><br>
    
    <label>Prazo Previsto</label><br>
    <input type="date" name="prazo" required>
    <br><br>
    
    <label>Status</label>
    <select name="status">
        <option>Aberto</option>
        <option>Em Andamento</option>
        <option>Concluido</option>
        <option>Cancelado</option>
    </select>
    <br><br>
    
    <label>Data de Conclusão</label> <br><br>
    <input type="date" name="dataConclusão">
    <br><br>
    
    <label>Comentario de Acompanhamento</label> <br><br>
    <input type="text" name="comentario" placeholder="Atualização Mais Recente">
    <button type="submit"> Salvar Plano de Ação</button>

  <script>
  document.getElementById('formPlano').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const dados = Object.fromEntries(formData.entries());

    
    const urlPowerAutomate = 'https://defaultb61d49822acd47e681e86b2c66e20b.13.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/13/workflows/348016b3bde54a47b4159b6b45544cba/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=NlhP96NiVsK85m-VTk7gLW9qbFpsnTqMR-YP6R5ZO60';

    try {
      const resposta = await fetch(urlPowerAutomate, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(dados)
      });

      if (resposta.ok) {
        alert('Plano de ação salvo com sucesso no SharePoint!');
        this.reset();
      } else {
        alert('Erro ao salvar. Verifique o console para mais detalhes.');
        console.error(await resposta.text());
      }
    } catch (erro) {
      console.error('Erro na requisição:', erro);
      alert('Não foi possível conectar. Tente novamente.');
    }
  });
</script>
</form>
</body>
</html>
