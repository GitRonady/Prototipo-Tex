<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title> Formulario Plano de Ação </title>
</head>
<body bgcolor="#f4f4f4" style="font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; padding: 20px;">
    <table width="500" align="left" bgcolor="#ffffff" cellpadding="30" cellspacing="0" border="0" style="border-top: 5px solid #181D3E; border-radius: 8px;">
    <tr>
      <td>
        <h2 align="center" style="color: #181D3E; margin-top: 0;">Plano de Ação</h2>
        <hr color="#BE1F25" size="2">
<form id="formPlano">
    <label> Area responsavel* </label><br>
    <select name="area" required style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;">
        <option value=""> Selecione a area </option>
        <option>Coleta</option>
        <option>HUB e MH</option>
        <option>Transferencia</option>
        <option>Last Mile</option>
        <option>Planejamento</option>
        <option>Outras Areas</option>
    </select>
    
    <br><br>
    <label>Problema Identificado*</label><br>
            <textarea name="problema" rows="3" maxlength="500" placeholder="Descreva o problema operacional..." required style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"></textarea>
    
    <label>Causa Raiz*</label><br>
    <textarea name="causa" rows="3" maxlength="500" placeholder="Qual é a causa identificada?" required style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"></textarea>
    
    <label>Plano de ação*</label><br>
    <textarea name="plano" rows="3" maxlength="500" placeholder="O que será feito para resolver o problema?" required style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"></textarea>
    <br><br>
    
    <label>Responsavel*</label><br>
    <input type="text" name="responsavel" maxlength="500" placeholder="Nome do responsavel" required>
    <br><br>
    
    <label>Prazo Previsto</label><br>
    <input type="date" name="prazo" required style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    <br><br>
    
    <label>Status</label>
    <select name="status" style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;">
        <option>Aberto</option>
        <option>Em Andamento</option>
        <option>Concluido</option>
        <option>Cancelado</option>
    </select>
    <br><br>
    
    <label>Data de Conclusão</label> <br><br>
    <input type="date" name="dataConclusao">
    <br><br>
    
    <label>Comentario de Acompanhamento</label> <br><br>
    <input type="text" name="comentario" maxlength="500" placeholder="Atualização mais recente" style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    
     <button type="submit" style="background-color: #181D3E; color: #ffffff; padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;">
    Enviar </button>
  <script>
  document.getElementById('formPlano').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const dados = Object.fromEntries(formData.entries());

    
    const urlPowerAutomate = 'https://defaultb61d49822acd47e681e86b2c66e20b.13.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/13/workflows/348016b3bde54a47b4159b6b45544cba/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=NlhP96NiVsK85m-VTk7gLW9qbFpsnTqMR-YP6R5ZO60';

    try {
      const resposta = await fetch(urlPowerAutomate, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(dados)
      });

      if (resposta.ok) {
        alert('Plano de ação salvo com sucesso no SharePoint!');
        this.reset();
      } else {
        alert('Erro ao salvar. Verifique o console para mais detalhes.');
        console.error(await resposta.text());
      }
    } catch (erro) {
      console.error('Erro na requisição:', erro);
      alert('Não foi possível conectar. Tente novamente.');
    }
  });
</script>
</form>
</body>
</html>
