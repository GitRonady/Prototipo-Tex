<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário Plano de Ação</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <body>
  
  <div id="telaLogin" class="login-overlay">
    <div class="login-card">
      <div class="login-cabecalho">
        <h1>Plano de Ação</h1>
        <p>informe seu e-mail</p>
      </div>
      <form id="formLogin" class="login-form">
        <label for="loginEmail">E-mail corporativo</label>
        <input type="email" id="loginEmail" name="email"
               placeholder="nome@totalexpress.com.br"
               autocomplete="email" required>
        <p id="loginErro" class="login-erro" hidden></p>
        <button type="submit" class="b-vermelho login-btn">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" x2="3" y1="12" y2="12"/>
          </svg>
          Entrar
        </button>
      </form>
    </div>
  </div>
   
  <div class="layout">

    <section class="painel">
      <div class="cabecalho"><h1>Plano de Ação</h1></div>
      <div class="corpo">
                <form id="formPlano" class="caixa">
          <div class="topo">
            <h2>
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
              Dados do Plano de Ação
            </h2>
            <div class="idbox"><small>ID do formulário:</small><span id="idForm">(novo)</span></div>
          </div>

          <div class="aviso-edicao" id="avisoEdicao" hidden>
            <span id="textoAvisoEdicao"></span>
            <button type="button" class="btn-liberar" id="btnLiberar" hidden>Editar campos já preenchidos</button>
          </div>


          <div class="campo">
            <label for="area">Area responsavel<b>*</b></label>
            <select id="area" name="area" required>
              <option value="">Selecione a area</option>
              <option>Coleta</option>
              <option>HUB e MH</option>
              <option>Transferencia</option>
              <option>Last Mile</option>
              <option>Planejamento</option>
              <option>Outras Areas</option>
            </select>
          </div>

          <div class="campo">
            <label for="problema">Problema Identificado<b>*</b></label>
            <textarea id="problema" name="problema" maxlength="500" placeholder="Descreva o problema operacional..." required></textarea>
            <div class="contador"></div>
          </div>

          <div class="campo">
            <label for="causa">Causa Raiz<b>*</b></label>
            <textarea id="causa" name="causa" maxlength="500" placeholder="Qual é a causa identificada?" required></textarea>
            <div class="contador"></div>
          </div>

          <div class="campo">
            <label for="plano">Plano de ação<b>*</b></label>
            <textarea id="plano" name="plano" maxlength="500" placeholder="O que será feito para resolver o problema?" required></textarea>
            <div class="contador"></div>
          </div>

         
          <div class="linha">
            <div class="campo">
              <label for="responsavel">Responsavel<b>*</b></label>
              <input type="text" id="responsavel" name="responsavel" maxlength="500" placeholder="Nome do responsavel" required>
            </div>
            <div class="campo">
              <label for="regional">Regional<b>*</b></label>
              <select id="regional" name="regional" required>
                <option value="">Selecione a Regional</option>
                <option>CO/N</option>
                <option>MG/RJ/ES</option>
                <option>NE</option>
                <option>SP</option>
                <option>SUL</option>
              </select>
            </div>
          </div>

         
          <div class="linha">
            <div class="campo">
              <label for="prazo">Prazo Previsto</label>
              <input type="date" id="prazo" name="prazo">
            </div>
            <div class="campo">
              <label for="status">Status</label>
              <select id="status" name="status">
                <option>Aberto</option>
                <option>Em Andamento</option>
                <option>Concluido</option>
                <option>Cancelado</option>
              </select>
            </div>
          </div>

         
          <div class="linha">
            <div class="campo">
              <label for="dataConclusao">Data de Conclusão</label>
              <input type="date" id="dataConclusao" name="dataConclusao">
            </div>
            <div class="campo">
              <label for="comentario">Comentario de Acompanhamento</label>
              <textarea id="comentario" name="comentario" maxlength="500" placeholder="Atualização mais recente" style="min-height:40px"></textarea>
              <div class="contador"></div>
            </div>
          </div>

          <div class="botoes">
            <button type="button" class="b-claro" id="btnNovo">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
              Novo formulário
            </button>
            <button type="button" class="b-azul" id="btnIncompleto">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Salvar como incompleto
            </button>
            <button type="submit" class="b-vermelho" id="btnConcluir">
              <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
              Enviar formulário
            </button>
          </div>
        </form>
      </div>
    </section>


    <section class="painel">
      <div class="cabecalho lista">
        <h2>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Meus Formulários
        </h2>
        <button type="button" class="b-atualizar" id="btnAtualizar">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          Atualizar
        </button>
      </div>
      <div class="corpo">
        <div class="info">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>Selecione um formulário para continuar o preenchimento.</span>
        </div>

        <div class="filtros">
          <button type="button" class="ativo" data-filtro="todos">Todos</button>
          <button type="button" data-filtro="pendente">Incompletos</button>
          <button type="button" data-filtro="finalizado">Concluídos</button>
        </div>

        <div id="listaFormularios"><p class="vazio">Carregando...</p></div>
      </div>
    </section>

  </div>
  <script src="script.js"></script>
</body>
</html>
