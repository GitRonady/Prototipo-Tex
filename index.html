<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Ocorrências</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  
  <div id="telaLogin" class="login-overlay">
    <div class="login-card">
      <div class="login-cabecalho">
        <h1>Gestão de Ocorrências</h1>
        <p>Informe seu e-mail corporativo</p>
      </div>
      <form id="formLogin" class="login-form">
        <label for="loginEmail">E-mail corporativo</label>
        <input type="email" id="loginEmail" name="email" placeholder="nome@totalexpress.com.br" autocomplete="email" required>
        <p id="loginErro" class="login-erro" hidden></p>
        <button type="submit" class="b-vermelho login-btn">Entrar</button>
      </form>
    </div>
  </div>

  <div class="layout">
    <section class="painel" id="painelFormulario">
      <div class="cabecalho">
        <h1>Torre de Controle</h1>
      </div>
      <div class="corpo">
        <form id="formPlano" class="caixa">
          <div class="topo">
            <h2>
              <svg class="ic" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
              <span id="tituloFormulario">Nova Ocorrência</span>
            </h2>
            <div class="idbox"><small>ID do formulário:</small><span id="idForm">(novo)</span></div>
          </div>

          <div class="aviso-edicao" id="avisoEdicao" hidden>
            <span id="textoAvisoEdicao"></span>
          </div>

          <div class="linha">
            <div class="campo">
              <label for="regional">Regional<b>*</b></label>
              <select id="regional" name="regional" required>
                <option value="">Selecione a Regional</option>
                <option>CO/N</option>
                <option>MG/RJ/ES</option>
                <option>NE</option>
                <option>SP</option>
                <option>SUL</option>
              </select>
            </div>
            <div class="campo">
              <label for="area">Área Responsável<b>*</b></label>
              <select id="area" name="area" required>
                <option value="">Selecione a Área</option>
                <option>Coleta</option>
                <option>HUB e MH</option>
                <option>Transferencia</option>
                <option>Last Mile</option>
                <option>Planejamento</option>
                <option>Outras Areas</option>
              </select>
            </div>
          </div>

          <div class="campo">
            <label for="problema">Problema Identificado<b>*</b></label>
            <textarea id="problema" name="problema" maxlength="500" placeholder="Descreva o problema operacional..." required></textarea>
            <div class="contador"></div>
          </div>

          <div id="camposExtras" style="display: none;">
            <div class="campo">
              <label for="causa">Causa Raiz<b>*</b></label>
              <textarea id="causa" name="causa" maxlength="500" placeholder="Qual é a causa identificada?"></textarea>
              <div class="contador"></div>
            </div>

            <div class="campo">
              <label for="plano">Plano de ação<b>*</b></label>
              <textarea id="plano" name="plano" maxlength="500" placeholder="O que será feito para resolver?"></textarea>
              <div class="contador"></div>
            </div>

            <div class="linha">
              <div class="campo">
                <label for="responsavel">Responsável pela Execução<b>*</b></label>
                <input type="text" id="responsavel" name="responsavel" maxlength="500" placeholder="Nome do responsável">
              </div>
              <div class="campo">
                <label for="prazo">Prazo Previsto</label>
                <input type="date" id="prazo" name="prazo">
              </div>
            </div>

            <div class="linha">
              <div class="campo">
                <label for="status">Status</label>
                <select id="status" name="status">
                  <option>Pendente de preenchimento</option>
                  <option>Em Andamento</option>
                  <option>Concluído</option>
                  <option>Cancelado</option>
                </select>
              </div>
              <div class="campo">
                <label for="dataConclusao">Data de Conclusão</label>
                <input type="date" id="dataConclusao" name="dataConclusao">
              </div>
            </div>

            <div class="campo">
              <label for="comentario">Comentário de Acompanhamento</label>
              <textarea id="comentario" name="comentario" maxlength="500" placeholder="Atualização mais recente" style="min-height:40px"></textarea>
              <div class="contador"></div>
            </div>
          </div>

          <div class="botoes">
            <button type="button" class="b-claro" id="btnVerLista">
              <svg class="ic" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              Ver Ocorrências
            </button>
            
            <button type="submit" class="b-vermelho" id="btnEnviarOcorrencia">
              <svg class="ic" viewBox="0 0 24 24"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Enviar Ocorrência
            </button>

            <button type="button" class="b-claro" id="btnVoltarLista" style="display: none;">
              <svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
              Voltar para Lista
            </button>

            <button type="submit" class="b-vermelho" id="btnConcluir" style="display: none;">
              <svg class="ic" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              Concluir Tratativa
            </button>
          </div>
        </form>
      </div>
    </section>

    <section class="painel" id="painelLista" style="display: none;">
      <div class="cabecalho lista">
        <h2>Ocorrências Registradas</h2>
        <button type="button" class="b-atualizar" id="btnAtualizar">
          <svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          Atualizar
        </button>
      </div>
      <div class="corpo">
        <div class="filtros">
          <button type="button" class="ativo" data-filtro="todos">Todos</button>
          <button type="button" data-filtro="pendente">Pendentes</button>
          <button type="button" data-filtro="finalizado">Concluídos</button>
        </div>
        <div id="listaFormularios"><p class="vazio">Carregando...</p></div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
