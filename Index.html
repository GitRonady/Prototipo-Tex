<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <title> formulario plano </title>
</head>

<body>
<form>
    <label> Area responsavel </label><br>
    <select required>
        <option value=""> Selecione a area </option>
        <option>Coleta</option>
        <option>HUB e MH</option>
        <option>Transferencia</option>
        <option>Last Mile</option>
        <option>Planejamento</option>
        <option>Outras Areas</option>
    </select>
    
    <br><br>
    <label>Problema Identificado</label><br>
    <textarea rows="4" cols="40" placeholder="Descreva o Problema operacional..." required></textarea>
    <br><br>
    
    <label>Caua Raiz</label><br>
    <textarea rows="4" cols="40" placeholder="Qual é a Causa Identificada?" required></textarea>
    <br><br>
    
    <label>Plano de ação</label><br>
    <textarea role="4" cols="40" placeholder="Oque Será Feito Para Resolver o Problema?" required></textarea>
    <br><br>
    
    <label>Responsavel</label><br>
    <input type="text" placeholder="Nome do responsavel" required>
    <br><br>
    
    <label>Prazo Previsto</label><br>
    <input type="date" required>
    <br><br>
    
    <label>Status</label>
    <select>
        <option>Aberto</option>
        <option>Em Andamento</option>
        <option>Concluido</option>
        <option>Cancelado</option>
    </select>
    <br><br>
    
    <label>Data de Conclusão</label> <br><br>
    <input type="date">
    <br><br>
    
    <label>Comentario de Acompanhamento</label> <br><br>
    <input type="text" placeholder="Atualização Mais Recente">
    <button type="submit"> Salvar Plano de Ação</button>
